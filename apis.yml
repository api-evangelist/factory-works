name: Factory Works
description: Factory Works (Factory Berlin) is a Berlin-based venture-building and company-builder
  firm that partners with entrepreneurs, visual artists, and musicians to turn early ideas into
  scalable businesses. Positioning itself as a "neo company builder," Factory builds and scales
  ventures in exchange for equity while handling strategy, product, brand, marketing, legal,
  accounting, and operations, and it runs a physical Berlin venue with event, restaurant, and
  studio infrastructure alongside a mentor and investor network. It was surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network. Factory publishes no public API,
  SDK, or developer platform, so this profile carries company identity only.
